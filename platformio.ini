; Attitude indicator for Waveshare ESP32-S3-Touch-LCD-1.28
; Only LVGL is used as a library: display, IMU and touch drivers are in src/.

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
	-O2
	-Iinclude
	-Isrc
	-DLV_CONF_INCLUDE_SIMPLE
lib_deps =
	lvgl/lvgl@^9.6.0

; Development helper: animated fake attitude, no IMU needed (for render stress tests).
[env:simulation]
extends = env:esp32-s3-devkitc-1
build_flags =
	${env:esp32-s3-devkitc-1.build_flags}
	-DSIM_ATTITUDE
